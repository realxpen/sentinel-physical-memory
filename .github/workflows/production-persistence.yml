name: Production Persistence Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-persistence.yml'
  workflow_dispatch:

jobs:
  verify-production-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed Neon-backed memory
        env:
          SENTINEL_MEMORY_URL: https://sentinel-physical-memory.vercel.app/api/memory?environmentId=phase3-verification
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "https://sentinel-physical-memory.vercel.app/api/memory?environmentId=phase3-verification"
          last_error = None

          for attempt in range(24):
              try:
                  request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "sentinel-production-smoke"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      payload = json.load(response)

                  memory = payload.get("memory") or {}
                  environment = memory.get("environment") or {}
                  states = memory.get("states") or []
                  snapshots = memory.get("snapshots") or []
                  diffs = memory.get("diffs") or []

                  snapshot_ids = {item.get("stateId") for item in snapshots if isinstance(item, dict)}

                  assert payload.get("persistence") == "neon", payload
                  assert environment.get("id") == "phase3-verification", environment
                  assert environment.get("currentStateId") == "state_b", environment
                  assert len(states) >= 2, states
                  assert {"state_a", "state_b"}.issubset(snapshot_ids), snapshots
                  assert len(diffs) >= 1, diffs

                  print("Production Neon persistence verified")
                  print(json.dumps({
                      "persistence": payload.get("persistence"),
                      "environmentId": environment.get("id"),
                      "currentStateId": environment.get("currentStateId"),
                      "states": len(states),
                      "snapshots": len(snapshots),
                      "diffs": len(diffs),
                  }, indent=2))
                  raise SystemExit(0)
              except Exception as error:
                  last_error = error
                  print(f"Attempt {attempt + 1}/24 not ready: {error}")
                  time.sleep(10)

          raise SystemExit(f"Production persistence verification failed: {last_error}")
          PY
