name: Phase 12 Positive Visual Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase12-positive-visual.yml'
      - 'api/verify.ts'
      - 'src/verification/service.ts'
      - 'src/ai/model.ts'
      - 'src/ai/nebius.ts'
      - 'scripts/check-phase12-positive-visual-production.mjs'
      - 'scripts/check-phase12-production-verification.mjs'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positive-visual-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Test 4 positive visual resolution
        env:
          SENTINEL_PRODUCTION_ORIGIN: https://sentinel-physical-memory.vercel.app
          SENTINEL_PHASE12_POSITIVE_ENVIRONMENT_ID: env_phase-12-verification-test-4_53870785
          SENTINEL_EXPECTED_DEPLOYMENT_COMMIT: ${{ github.sha }}
        run: node ./scripts/check-phase12-positive-visual-production.mjs
