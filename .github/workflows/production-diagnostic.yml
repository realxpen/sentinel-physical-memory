name: Production Persistence Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-diagnostic.yml'
      - 'api/health.ts'
      - 'api/memory.ts'
      - 'server/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Capture production endpoint response
        run: |
          python - <<'PY' > diagnostic.txt 2>&1
          import urllib.error
          import urllib.request

          urls = [
              "https://sentinel-physical-memory.vercel.app/",
              "https://sentinel-physical-memory.vercel.app/api/health",
              "https://sentinel-physical-memory.vercel.app/api/memory",
              "https://sentinel-physical-memory.vercel.app/api/memory?environmentId=phase3-verification",
          ]

          for url in urls:
              print("\n===", url, "===")
              request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "sentinel-production-diagnostic"})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode("utf-8", "replace")
                      print("HTTP:", response.status)
                      for key, value in response.headers.items():
                          print(f"{key}: {value}")
                      print("BODY:")
                      print(body[:4000])
              except urllib.error.HTTPError as error:
                  print("HTTP:", error.code)
                  for key, value in error.headers.items():
                      print(f"{key}: {value}")
                  print("BODY:")
                  print(error.read().decode("utf-8", "replace")[:4000])
              except Exception as error:
                  print("ERROR:", repr(error))
          PY
          cat diagnostic.txt
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: production-persistence-diagnostic
          path: diagnostic.txt
          if-no-files-found: error
