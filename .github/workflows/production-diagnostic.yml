name: Production Persistence Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Capture production endpoint response
        run: |
          python - <<'PY' > diagnostic.txt 2>&1
          import json
          import urllib.error
          import urllib.request

          url = "https://sentinel-physical-memory.vercel.app/api/memory?environmentId=phase3-verification"
          print("URL:", url)
          request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "sentinel-production-diagnostic"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read().decode("utf-8", "replace")
                  print("HTTP:", response.status)
                  print(body)
          except urllib.error.HTTPError as error:
              print("HTTP:", error.code)
              print(error.read().decode("utf-8", "replace"))
          except Exception as error:
              print("ERROR:", repr(error))
          PY
          cat diagnostic.txt
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: production-persistence-diagnostic
          path: diagnostic.txt
          if-no-files-found: error
