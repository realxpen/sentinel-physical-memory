name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify Phase 4 poor-input quality gate
        run: npm run check:phase4-poor-inputs
      - name: Verify provider canonicalization and evidence grounding
        run: npm run check:provider-boundary
      - name: Verify Phase 5 condition trust gate
        run: npm run check:phase5-conditions
      - name: Build
        run: npm run build
