name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify Phase 4 poor-input quality gate
        run: npm run check:phase4-poor-inputs
      - name: Verify provider canonicalization and evidence grounding
        run: npm run check:provider-boundary
      - name: Verify automatic perception retry
        run: npm run check:perception-retry
      - name: Verify targeted condition audit
        run: npm run check:condition-audit
      - name: Verify Phase 5 condition trust gate
        run: npm run check:phase5-conditions
      - name: Verify grounded operational condition derivation
        run: npm run check:condition-derivation
      - name: Verify Reality Diff position semantics
        run: npm run check:diff-position
      - name: Verify conservative object identity
        run: npm run check:object-identity
      - name: Verify Phase 6 immutable state history
        run: npm run check:phase6-history
      - name: Verify Phase 7 Diff Engine v2
        run: npm run check:phase7-diff
      - name: Verify phone photo observation
        run: npm run check:photo-observation
      - name: Verify paired-photo temporal diff
        run: npm run check:temporal-photo-diff
      - name: Verify state concurrency guard
        run: npm run check:state-concurrency
      - name: Verify Phase 8 change presentation
        run: npm run check:phase8-presentation
      - name: Verify Phase 9 spatial memory projection
        run: npm run check:phase9-spatial-memory
      - name: Verify Phase 9 mobile spatial memory experience
        run: npm run check:phase9-mobile
      - name: Build
        run: npm run build
