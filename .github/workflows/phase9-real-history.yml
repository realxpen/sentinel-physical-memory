name: Phase 9 Real History Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase9-real-history.yml'
      - 'api/states.ts'
      - 'src/memory/history.ts'
      - 'src/memory/spatial-memory.ts'
      - 'scripts/check-phase9-real-history.mjs'
      - 'package.json'
      - 'Knowledge/Technical/phase-9-spatial-memory.md'
      - 'Knowledge/Technical/phase-9-real-history-proof.md'
      - 'PROJECT_STATE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase9-real-history.yml'
      - 'api/states.ts'
      - 'src/memory/history.ts'
      - 'src/memory/spatial-memory.ts'
      - 'scripts/check-phase9-real-history.mjs'
      - 'package.json'
      - 'Knowledge/Technical/phase-9-spatial-memory.md'
      - 'Knowledge/Technical/phase-9-real-history-proof.md'
      - 'PROJECT_STATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-real-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate existing Neon-backed multi-state history
        env:
          SENTINEL_PRODUCTION_ORIGIN: https://sentinel-physical-memory.vercel.app
          SENTINEL_PHASE9_VALIDATION_ENVIRONMENT_ID: env_warehouse_73266674
          SENTINEL_EXPECTED_DEPLOYMENT_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: npm run check:phase9-real-history
