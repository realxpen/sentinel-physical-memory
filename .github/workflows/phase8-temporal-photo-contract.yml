name: Phase 8 Temporal Photo Contract

on:
  push:
    branches: [main]
    paths:
      - 'api/scan.ts'
      - 'src/ai/model.ts'
      - 'src/ai/nebius.ts'
      - 'src/domain/sentinel.ts'
      - 'src/scan/pipeline.ts'
      - 'src/memory/store.ts'
      - 'src/memory/diff-engine.ts'
      - '.github/workflows/phase8-temporal-photo-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-real-photo-pair:
    runs-on: ubuntu-latest
    env:
      SENTINEL_BASE_URL: https://sentinel-physical-memory.vercel.app
      FIXTURE_ENVIRONMENT_ID: env_office-proof-6_0151bfc9
    steps:
      - name: Replay real Office Proof 6 images through production
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ['SENTINEL_BASE_URL'].rstrip('/')
          fixture_environment = os.environ['FIXTURE_ENVIRONMENT_ID']
          expected_commit = os.environ.get('GITHUB_SHA', '').strip()

          def request_json(path, payload=None, timeout=180):
              body = None if payload is None else json.dumps(payload).encode('utf-8')
              headers = {
                  'Accept': 'application/json',
                  'User-Agent': 'sentinel-temporal-photo-contract',
                  'Origin': base,
              }
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(base + path, data=body, method='POST' if body is not None else 'GET', headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      text = response.read().decode('utf-8', 'replace')
                      return response.status, json.loads(text)
              except urllib.error.HTTPError as error:
                  text = error.read().decode('utf-8', 'replace')
                  try:
                      parsed = json.loads(text)
                  except Exception:
                      parsed = {'raw': text}
                  return error.code, parsed
              except Exception as error:
                  return 0, {'networkError': f'{type(error).__name__}: {error}'}

          print(f'Waiting for production commit {expected_commit[:12]}...')
          for attempt in range(120):
              status, health = request_json('/api/health', timeout=15)
              if status == 200 and health.get('deploymentCommit') == expected_commit:
                  print('Fresh production deployment detected.')
                  break
              if attempt == 119:
                  raise AssertionError({'message': 'Production deployment timeout', 'health': health})
              time.sleep(5)

          path = '/api/memory?environmentId=' + urllib.parse.quote(fixture_environment)
          status, payload = request_json(path, timeout=60)
          assert status == 200 and payload.get('memory'), (status, payload)
          memory = payload['memory']

          states = sorted(memory.get('states') or [], key=lambda item: item.get('version', 0))
          assert len(states) >= 2, 'Office Proof 6 must contain v1 and v2'
          sources = {item['id']: item for item in (memory.get('sources') or [])}
          first_source = sources[states[0]['sourceIds'][0]]
          second_source = sources[states[1]['sourceIds'][0]]
          first_uri = first_source['uri']
          second_uri = second_source['uri']
          assert first_uri.startswith('data:image/') and second_uri.startswith('data:image/')

          def mime(uri):
              return uri.split(';', 1)[0].replace('data:', '')

          def byte_size(uri):
              encoded = uri.split(',', 1)[1]
              return len(base64.b64decode(encoded))

          environment = f"phase8-temporal-{os.environ.get('GITHUB_RUN_ID', 'manual')}"
          def scan(source_id, uri, captured_at):
              return {
                  'environmentId': environment,
                  'source': {
                      'id': source_id,
                      'environmentId': environment,
                      'capturedAt': captured_at,
                      'metadata': {'name': 'Phase 8 Temporal Production Replay', 'environmentType': 'office'},
                  },
                  'media': {
                      'kind': 'image',
                      'uri': uri,
                      'mimeType': mime(uri),
                      'sizeBytes': byte_size(uri),
                  },
              }

          status, first = request_json('/api/scan', scan('source_temporal_v1', first_uri, '2026-09-20T17:00:00.000Z'), timeout=180)
          assert status == 200, ('baseline scan failed', status, first)
          assert first.get('state', {}).get('version') == 1, first
          print('Baseline photo persisted.')

          status, second = request_json('/api/scan', scan('source_temporal_v2', second_uri, '2026-09-20T17:05:00.000Z'), timeout=180)
          assert status == 200, ('update scan failed', status, second)
          assert second.get('state', {}).get('version') == 2, second

          changes = second.get('diff', {}).get('changes') or []
          titles = [item.get('title') for item in changes]
          print('Production temporal titles:', titles)

          assert 'New: duffle bag' in titles or 'New: duffel bag' in titles, titles
          assert 'Changed: white door' in titles, titles
          door = next(item for item in changes if item.get('title') == 'Changed: white door')
          assert 'closed' in (door.get('description') or '').lower() and 'open' in (door.get('description') or '').lower(), door

          forbidden = [
              title for title in titles
              if title and any(token in title.lower() for token in [
                  'door handle', 'door hinge', 'door frame', 'threshold',
                  'not re-observed: wicker basket', 'changed: white closet',
              ])
          ]
          assert not forbidden, forbidden

          print('PHASE 8 TEMPORAL PHOTO PRODUCTION CONTRACT VERIFIED')
          print(json.dumps({
              'deploymentCommit': expected_commit,
              'environmentId': environment,
              'baselineStateId': first.get('state', {}).get('id'),
              'currentStateId': second.get('state', {}).get('id'),
              'changes': [
                  {'type': item.get('type'), 'title': item.get('title'), 'confidence': item.get('confidence')}
                  for item in changes
              ],
          }, indent=2))
          PY
